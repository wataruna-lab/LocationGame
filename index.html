<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位置情報チャレンジ</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; text-align: center; }
        .header { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn-small { background-color: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; cursor: pointer; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { font-size: 24px; margin-top: 0; color: #2c3e50; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .status-item { font-size: 14px; color: #666; }
        .status-value { font-size: 20px; font-weight: bold; color: #e74c3c; margin-top: 5px; }
        .btn-large { background-color: #3498db; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3); transition: transform 0.1s; }
        .btn-large:active { transform: scale(0.95); }
        .btn-large:disabled { background-color: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        .history-list { text-align: left; margin-top: 15px; padding: 0; list-style: none; }
        .history-list li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 80%; max-width: 300px; }
        .modal input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .flex-btns { display: flex; gap: 10px; margin-top: 15px; }
        .flex-btns button { flex: 1; }
        .btn-danger { background-color: #e74c3c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        .btn-success { background-color: #2ecc71; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-small" onclick="openSettings()">場所設定</button>
    </div>

    <div class="card">
        <h1 id="gameTitle">くりむどうチャレンジ！</h1>
        
        <div class="status-grid">
            <div class="status-item">
                残りチャレンジ
                <div class="status-value" id="dispRemaining">5回</div>
            </div>
            <div class="status-item">
                累計ポイント
                <div class="status-value" id="dispTotalPoints">0 pt</div>
            </div>
            <div class="status-item">
                現在地との距離
                <div class="status-value" id="dispDistance">測定中...</div>
            </div>
            <div class="status-item">
                獲得確率 / 予定pt
                <div class="status-value" id="dispOdds">--% / --pt</div>
            </div>
        </div>

        <button id="challengeBtn" class="btn-large" onclick="doChallenge()" disabled>チャレンジ！</button>
        <p id="resultMsg" style="font-weight: bold; margin-top: 15px; height: 20px;"></p>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 16px;">履歴 (本日の記録)</h3>
        <ul class="history-list" id="historyList">
            <!-- 履歴がここに入ります -->
        </ul>
        <button class="btn-small" style="background-color: #e74c3c; width: 100%; margin-top: 15px;" onclick="confirmReset()">データを初期化する</button>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>場所設定</h3>
            <label>名称</label>
            <input type="text" id="inputName" value="くりむどう">
            <label>緯度</label>
            <input type="number" id="inputLat" value="36.199168" step="0.000001">
            <label>経度</label>
            <input type="number" id="inputLng" value="140.258183" step="0.000001">
            <div class="flex-btns">
                <button class="btn-small" onclick="closeSettings()">キャンセル</button>
                <button class="btn-success" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <!-- リセット確認モーダル -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #e74c3c;">本当にリセットしますか？</h3>
            <p style="font-size: 14px;">今日のポイントと履歴がすべて消去され、5回からやり直しになります。</p>
            <div class="flex-btns">
                <button class="btn-small" onclick="closeReset()">NO</button>
                <button class="btn-danger" onclick="executeReset()">YES</button>
            </div>
        </div>
    </div>

    <script>
        // --- 変数と初期値 ---
        let targetName = "くりむどう";
        let targetLat = 36.199168;
        let targetLng = 140.258183;
        
        let remaining = 5;
        let totalPoints = 0;
        let historyData = [];
        
        let currentDistance = 0;
        let currentProb = 0;
        let currentPoint = 0;

        // --- セーブ＆ロード機能 ---
        function getTodayString() {
            // 日本時間の日付文字列を取得 (例: "2026/10/6")
            return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
        }

        function loadData() {
            const savedDate = localStorage.getItem("locGame_date");
            const today = getTodayString();

            // 保存されている日付と今日が違う場合、またはデータがない場合はリセット
            if (savedDate !== today) {
                executeReset(false); // UI更新なしで内部リセット
                localStorage.setItem("locGame_date", today);
            } else {
                // 今日のデータがあれば読み込む
                remaining = parseInt(localStorage.getItem("locGame_remaining")) || 0;
                totalPoints = parseInt(localStorage.getItem("locGame_total")) || 0;
                const savedHistory = localStorage.getItem("locGame_history");
                if (savedHistory) historyData = JSON.parse(savedHistory);
                
                // 設定情報もあれば読み込む
                targetName = localStorage.getItem("locGame_name") || "くりむどう";
                targetLat = parseFloat(localStorage.getItem("locGame_lat")) || 36.199168;
                targetLng = parseFloat(localStorage.getItem("locGame_lng")) || 140.258183;
            }
            updateUI();
        }

        function saveData() {
            localStorage.setItem("locGame_remaining", remaining);
            localStorage.setItem("locGame_total", totalPoints);
            localStorage.setItem("locGame_history", JSON.stringify(historyData));
            
            localStorage.setItem("locGame_name", targetName);
            localStorage.setItem("locGame_lat", targetLat);
            localStorage.setItem("locGame_lng", targetLng);
            localStorage.setItem("locGame_date", getTodayString()); // 日付も更新
        }

        // --- 距離・ポイント計算 ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球の半径 (km)
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function updateLocation() {
            if (!navigator.geolocation) {
                document.getElementById('dispDistance').innerText = "GPS非対応";
                return;
            }
            
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                let dist = getDistance(lat, lng, targetLat, targetLng);
                if (dist > 40) dist = 40; // 50km上限
                currentDistance = dist;

                // ポイント計算: 100 * (1.1^d)
                currentPoint = Math.floor(100 * Math.pow(1.1, dist));
                // 確率計算: 100 - (d * 1.9), 最低5%
                currentProb = Math.floor(100 - (dist * 1.9));
                if (currentProb < 5) currentProb = 5;

                document.getElementById('dispDistance').innerText = dist.toFixed(2) + " km";
                document.getElementById('dispOdds').innerText = currentProb + "% / " + currentPoint + "pt";
                
                if (remaining > 0) {
                    document.getElementById('challengeBtn').disabled = false;
                }
            }, (err) => {
                document.getElementById('dispDistance').innerText = "取得エラー";
            }, { enableHighAccuracy: true });
        }

        // --- ゲーム進行 ---
        function doChallenge() {
            if (remaining <= 0) return;
            
            remaining--;
            const roll = Math.floor(Math.random() * 100) + 1; // 1〜100のサイコロ
            let resultText = "";
            let gained = 0;

            if (roll <= currentProb) {
                // 成功
                gained = currentPoint;
                totalPoints += gained;
                resultText = `成功！ ${gained}pt 獲得！`;
                document.getElementById('resultMsg').style.color = "#2ecc71";
            } else {
                // 失敗
                resultText = "失敗... ポイントなし";
                document.getElementById('resultMsg').style.color = "#e74c3c";
            }

            document.getElementById('resultMsg').innerText = resultText;
            
            // 履歴に追加
            const timeStr = new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
            historyData.unshift(`${timeStr} - ${currentDistance.toFixed(1)}km - ${resultText}`);
            
            saveData();
            updateUI();
        }

        function updateUI() {
            document.getElementById('gameTitle').innerText = targetName + "チャレンジ！";
            document.getElementById('dispRemaining').innerText = remaining + "回";
            document.getElementById('dispTotalPoints').innerText = totalPoints + " pt";
            
            if (remaining <= 0) {
                document.getElementById('challengeBtn').disabled = true;
                document.getElementById('challengeBtn').innerText = "本日は終了！";
            } else {
                document.getElementById('challengeBtn').innerText = "チャレンジ！";
            }

            const listEl = document.getElementById('historyList');
            listEl.innerHTML = "";
            historyData.forEach(item => {
                let li = document.createElement('li');
                li.innerText = item;
                listEl.appendChild(li);
            });
        }

        // --- モーダル・リセット操作 ---
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        
        function saveSettings() {
            targetName = document.getElementById('inputName').value;
            targetLat = parseFloat(document.getElementById('inputLat').value);
            targetLng = parseFloat(document.getElementById('inputLng').value);
            saveData();
            updateUI();
            closeSettings();
            document.getElementById('resultMsg').innerText = "";
        }

        function confirmReset() { document.getElementById('resetModal').style.display = 'flex'; }
        function closeReset() { document.getElementById('resetModal').style.display = 'none'; }
        
        function executeReset(updateDisplay = true) {
            remaining = 5;
            totalPoints = 0;
            historyData = [];
            document.getElementById('resultMsg').innerText = "";
            saveData();
            if(updateDisplay) {
                updateUI();
                closeReset();
                if (currentDistance > 0) document.getElementById('challengeBtn').disabled = false;
            }
        }

        // --- 起動時の処理 ---
        window.onload = () => {
            loadData();
            updateLocation();
            
            // 設定画面の初期値を反映
            document.getElementById('inputName').value = targetName;
            document.getElementById('inputLat').value = targetLat;
            document.getElementById('inputLng').value = targetLng;
        };
    </script>
</body>
</html>
